<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital Santa Cecília | Almoxarifado</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f1f5f9; color: #243247; font-family: "Segoe UI", Arial, sans-serif; }
    .topbar { background: #123b63; color: #fff; padding: 16px 5%; display: flex; justify-content: space-between; align-items: center; gap: 15px; flex-wrap: wrap; box-shadow: 0 3px 12px #0002; }
    .hospital-info h1 { margin: 0 0 4px; font-size: 20px; }
    .hospital-info p { margin: 0; color: #d6e6f5; font-size: 13px; }
    .topbar-actions { display: flex; align-items: center; gap: 15px; }
    .status { background: #ffffff26; padding: 8px 14px; border-radius: 20px; font-size: 13px; }
    button { border: 0; border-radius: 7px; padding: 10px 15px; font-size: 14px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    .btn-sair { background: #dc2626; color: #fff; }
    .btn-primary { background: #1768a6; color: #fff; }
    .btn-delete { background: #fee2e2; color: #b91c1c; }
    .page { width: min(1100px, 92%); margin: 30px auto; }
    .page-heading { display: flex; justify-content: space-between; align-items: center; gap: 15px; flex-wrap: wrap; margin-bottom: 22px; }
    .page-heading h2 { margin: 0 0 6px; color: #173e63; font-size: 26px; }
    .page-heading p { margin: 0; color: #64748b; font-size: 14px; }
    .panel { margin-bottom: 22px; padding: 24px; background: #fff; border: 1px solid #e1e8f0; border-radius: 12px; box-shadow: 0 5px 18px #1f37500a; }
    .panel h3 { margin: 0 0 18px; color: #173e63; }
    .form-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { color: #34465b; font-size: 13px; font-weight: 700; }
    .field input,.field select { width: 100%; min-height: 42px; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 7px; background: #fff; font-size: 14px; }
    .field.full { grid-column: 1/-1; }
    .notice { display: none; margin: 0 0 18px; padding: 12px 15px; border-radius: 8px; font-size: 14px; }
    .notice.success { display: block; color: #15803d; background: #dcfce7; border: 1px solid #bbf7d0; }
    .notice.error { display: block; color: #b91c1c; background: #fee2e2; border: 1px solid #fecaca; }
    .inventory { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 15px; }
    .item { padding: 18px; border: 1px solid #dce5ee; border-left: 4px solid #1768a6; border-radius: 10px; }
    .item h4 { margin: 0 0 9px; color: #173e63; font-size: 17px; overflow-wrap: anywhere; }
    .item p { margin: 5px 0; color: #526276; font-size: 14px; }
    .item.low { border-left-color: #dc2626; }
    .item-actions { display: flex; align-items: end; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .item-actions label { flex: 1; min-width: 130px; color: #526276; font-size: 12px; }
    .item-actions input { display: block; width: 100%; margin-top: 4px; min-height: 38px; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; }
    .empty { grid-column: 1/-1; padding: 26px; text-align: center; color: #64748b; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 9px; }
    .rodape { padding: 0 15px 30px; color: #8492a5; font-size: 12px; text-align: center; }
    @media (max-width: 700px) { .form-grid,.inventory { grid-template-columns: 1fr; } .field.full { grid-column: auto; } .item-actions button { flex: 1; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="hospital-info"><h1>Hospital Santa Cecília</h1><p>Sistema Integrado de Gestão Hospitalar</p></div>
    <div class="topbar-actions"><div class="status">● Almoxarifado / Estoque</div><button class="btn-sair" type="button" onclick="sair()">Sair</button></div>
  </header>
  <main class="page">
    <div class="page-heading"><div><h2>📦 Gestão do Almoxarifado</h2><p>Cadastre itens e acompanhe as quantidades disponíveis no estoque.</p></div><button class="btn-primary" type="button" id="btnAtualizar">↻ Atualizar estoque</button></div>
    <section class="panel">
      <h3>Cadastrar item no estoque</h3>
      <div id="aviso" class="notice" role="status" aria-live="polite"></div>
      <form id="formEstoque">
        <div class="form-grid">
          <div class="field full"><label for="nome">Nome do item *</label><input id="nome" required maxlength="120" placeholder="Ex.: Luvas descartáveis"></div>
          <div class="field"><label for="quantidade">Quantidade inicial *</label><input id="quantidade" type="number" min="1" step="1" required></div>
          <div class="field"><label for="estoqueMinimo">Estoque mínimo</label><input id="estoqueMinimo" type="number" min="0" step="1" value="10"></div>
          <div class="field"><label for="unidade">Unidade</label><input id="unidade" maxlength="30" value="unidades" placeholder="unidades, caixas..."></div>
          <div class="field"><label for="categoria">Categoria</label><input id="categoria" maxlength="60" value="geral" placeholder="materiais, medicamentos..."></div>
        </div>
        <p style="margin:18px 0 0"><button type="submit" class="btn-primary" id="btnCadastrar">Cadastrar item</button></p>
      </form>
    </section>
    <section class="panel">
      <h3>Itens cadastrados</h3>
      <div id="inventario" class="inventory"><div class="empty">Carregando estoque...</div></div>
    </section>
  </main>
  <footer class="rodape">Hospital Santa Cecília · Módulo de Almoxarifado</footer>
  <script>
    const form = document.getElementById("formEstoque");
    const aviso = document.getElementById("aviso");
    const inventario = document.getElementById("inventario");

    function mostrarAviso(mensagem, sucesso = false) {
      aviso.textContent = mensagem;
      aviso.className = "notice " + (sucesso ? "success" : "error");
    }

    async function carregarEstoque() {
      inventario.innerHTML = '<div class="empty">Carregando estoque...</div>';
      try {
        const resposta = await fetch("/estoque", { headers: { Accept: "application/json" } });
        const itens = await resposta.json();
        if (!resposta.ok) throw new Error(itens.erro || "Não foi possível carregar o estoque.");
        renderizarEstoque(itens);
      } catch (erro) {
        console.error("Erro ao carregar estoque:", erro);
        inventario.innerHTML = '<div class="empty">Não foi possível carregar o estoque. Verifique a conexão com o servidor.</div>';
      }
    }

    function renderizarEstoque(itens) {
      inventario.replaceChildren();
      if (!Array.isArray(itens) || itens.length === 0) {
        inventario.innerHTML = '<div class="empty">Nenhum item cadastrado no estoque.</div>';
        return;
      }
      itens.forEach(item => {
        const card = document.createElement("article");
        const quantidade = Number(item.quantidade) || 0;
        const minimo = Number(item.estoqueMinimo) || 0;
        card.className = "item" + (quantidade <= minimo ? " low" : "");
        const titulo = document.createElement("h4"); titulo.textContent = item.nome || "Item sem nome";
        const qtd = document.createElement("p"); qtd.textContent = `Disponível: ${quantidade} ${item.unidade || "unidades"}`;
        const min = document.createElement("p"); min.textContent = `Estoque mínimo: ${minimo}`;
        const categoria = document.createElement("p"); categoria.textContent = `Categoria: ${item.categoria || "geral"}`;
        card.append(titulo, qtd, min, categoria);
        const actions = document.createElement("div"); actions.className = "item-actions";
        const label = document.createElement("label"); label.textContent = "Ajuste de quantidade (+ entrada / − saída)";
        const input = document.createElement("input"); input.type = "number"; input.step = "1"; input.placeholder = "Ex.: 5 ou -2"; input.setAttribute("aria-label", `Ajuste de quantidade para ${item.nome}`); label.appendChild(input);
        const ajustar = document.createElement("button"); ajustar.type = "button"; ajustar.className = "btn-primary"; ajustar.textContent = "Ajustar"; ajustar.addEventListener("click", () => ajustarQuantidade(item.id, input));
        const excluir = document.createElement("button"); excluir.type = "button"; excluir.className = "btn-delete"; excluir.textContent = "Excluir"; excluir.addEventListener("click", () => excluirItem(item.id, item.nome));
        actions.append(label, ajustar, excluir); card.appendChild(actions); inventario.appendChild(card);
      });
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      const botao = document.getElementById("btnCadastrar");
      botao.disabled = true;
      try {
        const resposta = await fetch("/estoque", { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify({ nome: document.getElementById("nome").value.trim(), quantidade: document.getElementById("quantidade").value, estoqueMinimo: document.getElementById("estoqueMinimo").value, unidade: document.getElementById("unidade").value.trim(), categoria: document.getElementById("categoria").value.trim() }) });
        const dados = await resposta.json();
        if (!resposta.ok) throw new Error(dados.erro || "Falha ao cadastrar item.");
        mostrarAviso("Item cadastrado no estoque.", true); form.reset(); document.getElementById("estoqueMinimo").value = 10; document.getElementById("unidade").value = "unidades"; document.getElementById("categoria").value = "geral";
        await carregarEstoque();
      } catch (erro) { mostrarAviso(erro.message || "Erro ao conectar com o servidor."); }
      finally { botao.disabled = false; }
    });

    async function ajustarQuantidade(id, input) {
      if (!input.value || !Number.isInteger(Number(input.value)) || Number(input.value) === 0) { mostrarAviso("Informe um ajuste inteiro diferente de zero."); return; }
      try {
        const resposta = await fetch(`/estoque/${encodeURIComponent(id)}`, { method: "PATCH", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify({ quantidade: Number(input.value) }) });
        const dados = await resposta.json();
        if (!resposta.ok) throw new Error(dados.erro || "Falha ao ajustar estoque.");
        mostrarAviso("Quantidade atualizada.", true); await carregarEstoque();
      } catch (erro) { mostrarAviso(erro.message || "Erro ao atualizar estoque."); }
    }

    async function excluirItem(id, nome) {
      if (!confirm(`Deseja excluir o item \"${nome}\" do estoque?`)) return;
      try {
        const resposta = await fetch(`/estoque/${encodeURIComponent(id)}`, { method: "DELETE", headers: { Accept: "application/json" } });
        const dados = await resposta.json();
        if (!resposta.ok) throw new Error(dados.erro || "Falha ao excluir item.");
        mostrarAviso("Item removido do estoque.", true); await carregarEstoque();
      } catch (erro) { mostrarAviso(erro.message || "Erro ao excluir item."); }
    }

    function sair() { sessionStorage.clear(); localStorage.removeItem("hospital_user"); window.location.href = "index.html"; }
    document.getElementById("btnAtualizar").addEventListener("click", carregarEstoque);
    carregarEstoque();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital Santa Cecília | Login</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Arial, sans-serif; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #123b63; color: #243247; padding: 20px; }
    .login-card { background: #fff; width: 100%; max-width: 400px; padding: 35px 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.25); text-align: center; }
    .hospital-logo-img { max-width: 130px; max-height: 130px; object-fit: contain; margin: 0 auto 15px; display: block; }
    .login-card h1 { font-size: 22px; color: #123b63; margin-bottom: 6px; }
    .login-card p { font-size: 13px; color: #64748b; margin-bottom: 25px; }
    .campo { display: flex; flex-direction: column; text-align: left; margin-bottom: 18px; }
    .campo label { font-size: 13px; font-weight: 700; color: #34465b; margin-bottom: 6px; }
    .campo input { width: 100%; height: 44px; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; }
    .campo input:focus { border-color: #1768a6; box-shadow: 0 0 0 3px rgba(23,104,166,.12); }
    .btn-entrar { width: 100%; height: 46px; background: #1768a6; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; transition: background .2s; margin-top: 10px; }
    .btn-entrar:hover { background: #105487; }
    .btn-entrar:disabled { background: #94a3b8; cursor: not-allowed; }
    .mensagem-erro { display: none; background: #fee2e2; border: 1px solid #fecaca; color: #b91c1c; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 18px; }
    .rodape-login { margin-top: 25px; font-size: 12px; color: #64748b; line-height: 1.8; }
    .rodape-login a { color: #1768a6; }
  </style>
</head>
<body>
  <div class="login-card">
    <!-- Caminho idêntico ao nome real do arquivo: há underscore entre Santa e Cecília. -->
    <img src="img/Refined_Gold_Foil_Logo_of_Santa_Cec%C3%ADlia-removebg-preview.png"
         alt="Logo Hospital Santa Cecília" class="hospital-logo-img">

    <h1>Hospital Santa Cecília</h1>
    <p>Acesso ao Sistema de Gestão Hospitalar</p>

    <div id="mensagemErro" class="mensagem-erro" role="alert"></div>

    <form id="formLogin">
      <div class="campo">
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" placeholder="Digite seu usuário" required autocomplete="username">
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Digite sua senha" required autocomplete="current-password">
      </div>
      <button type="submit" id="btnEntrar" class="btn-entrar">Entrar no Sistema</button>
    </form>

    <div class="rodape-login">
      Hospital Santa Cecília · Atalho de Segurança (Ctrl + Alt + A)<br>
      <a href="modulos.html">Abrir lista de módulos do sistema</a>
    </div>
  </div>

  <script>
    const formLogin = document.getElementById("formLogin");
    const mensagemErro = document.getElementById("mensagemErro");
    const btnEntrar = document.getElementById("btnEntrar");

    function normalizarPerfil(valor) {
      const chave = String(valor || "").toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      const perfis = {
        admin: "admin", administrador: "admin", administrador_geral: "admin",
        atendimento: "atendimento", recepcao: "atendimento", atendente: "atendimento",
        triagem: "triagem", enfermagem: "triagem", enfermeiro: "triagem",
        medico: "medico", doutor: "medico",
        medicacoes: "medicacoes", farmacia: "medicacoes", farmaceutico: "medicacoes",
        almoxarifado: "almoxarifado", estoque: "almoxarifado", tv: "tv"
      };
      return perfis[chave] || "";
    }

    formLogin.addEventListener("submit", async function(event) {
      event.preventDefault();
      const loginDigitado = document.getElementById("usuario").value.trim();
      const senha = document.getElementById("senha").value.trim();
      mensagemErro.style.display = "none";
      btnEntrar.disabled = true;
      btnEntrar.textContent = "Autenticando...";

      try {
        const resposta = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify({ usuario: loginDigitado, senha })
        });
        const dados = await resposta.json().catch(() => null);
        if (!resposta.ok) {
          throw new Error((dados && (dados.erro || dados.message)) || "Usuário ou senha inválidos.");
        }
        if (!dados || typeof dados !== "object") {
          throw new Error("O servidor retornou uma resposta de login inválida.");
        }

        // Aceita respostas diretas e envelopadas, inclusive APIs que usam username/role.
        const usuarioObj = [dados.usuario, dados.user, dados.data?.usuario, dados.data?.user, dados.data]
          .find(valor => valor && typeof valor === "object") || dados;
        const loginAutenticado = usuarioObj.usuario || usuarioObj.username || usuarioObj.login ||
          (typeof dados.usuario === "string" ? dados.usuario : "") || loginDigitado;
        const perfilResposta = usuarioObj.tipo || usuarioObj.perfil || usuarioObj.role ||
          usuarioObj.tipo_usuario || usuarioObj.userType || usuarioObj.user_type ||
          dados.tipo || dados.perfil || dados.role;
        // Algumas versões antigas da API devolvem somente o login; para os perfis padrão
        // o perfil pode ser reconhecido pelo nome de usuário. Usuários customizados precisam
        // ter o perfil preenchido no cadastro.
        const tipo = normalizarPerfil(perfilResposta) || normalizarPerfil(loginAutenticado);
        if (!tipo) {
          throw new Error("O login foi aceito, mas esse usuário não tem perfil definido. Peça ao administrador para corrigir o perfil do cadastro.");
        }

        const usuarioSeguro = {
          id: usuarioObj.id || dados.id || null,
          nome: usuarioObj.nome || usuarioObj.name || loginAutenticado,
          usuario: loginAutenticado,
          tipo
        };
        sessionStorage.setItem("usuarioLogado", JSON.stringify(usuarioSeguro));
        localStorage.setItem("hospital_user", JSON.stringify(usuarioSeguro));

        const telas = {
          atendimento: "atendimento.html", triagem: "triagem.html", medico: "medico.html",
          medicacoes: "medicacoes.html", admin: "admin.html",
          almoxarifado: "almoxarifado.html", tv: "tv.html"
        };
        window.location.href = telas[tipo] || "modulos.html";
      } catch (erro) {
        console.error("Erro no login:", erro);
        mensagemErro.textContent = erro.message === "Failed to fetch"
          ? "Não foi possível conectar ao servidor. Abra o sistema pelo endereço publicado ou inicie o servidor local com npm start."
          : erro.message;
        mensagemErro.style.display = "block";
      } finally {
        btnEntrar.disabled = false;
        btnEntrar.textContent = "Entrar no Sistema";
      }
    });

    document.addEventListener("keydown", function(e) {
      if (e.ctrlKey && e.altKey && e.key.toLowerCase() === "a") {
        e.preventDefault();
        window.location.href = "admin.html";
      }
    });
  </script>
</body>
</html>
